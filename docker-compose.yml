services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Kaliningrad
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT_HOST:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/client.cnf:/etc/mysql/conf.d/client.cnf:ro
      - ./db/sql.sh:/usr/local/bin/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  # разовый запуск конвейера: схема -> справочник -> реестр -> пересчёт -> отчёт
  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      CARRIER_URL: http://carrier
    volumes:
      - ./exchange:/srv/exchange
    depends_on:
      db:
        condition: service_healthy

  # веб-сервис: API и дашборд
  api:
    build: .
    command: ["uvicorn", "sla.server:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_completed_successfully

  # учебная заглушка HTTP-выгрузки службы доставки (раздаёт файлы из exchange/)
  carrier:
    image: nginx:1.27-alpine
    profiles: ["carrier"]
    volumes:
      - ./exchange:/usr/share/nginx/html:ro
    ports:
      - "${CARRIER_PORT:-8090}:80"

  # тесты всех трёх уровней в сети Compose
  test:
    build: .
    profiles: ["test"]
    command: ["pytest", "-v"]
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      RUN_DB_TESTS: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
